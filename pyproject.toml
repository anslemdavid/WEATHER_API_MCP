[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "weather-api-mcp"
version = "2.0.0"
description = "Live, zero-key Open-Meteo weather MCP server and animated 3D dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "mcp[cli]>=1.2,<2",
]

[project.scripts]
weather-mcp = "weather_mcp.server:main"
weather-dashboard = "weather_mcp.dashboard:main"

[tool.hatch.build.targets.wheel]
packages = ["weather_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
